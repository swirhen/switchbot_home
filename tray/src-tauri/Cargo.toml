[package]
name = "switchbot-home-tray"
version = "0.1.0"
description = "SwitchBot Home をタスクトレイから開くアプリ"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
# 常駐アプリなので、サイズを小さくする
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
