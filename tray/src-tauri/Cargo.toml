[package]
name = "switchbot-home-tray"
version = "1.0.1"
description = "SwitchBot Home をタスクトレイから開くアプリ"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# 前面のウインドウを調べる（リサイズ中にフォーカスが外れても隠さないため）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# 常駐アプリなので、サイズを小さくする
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
